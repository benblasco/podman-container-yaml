---
- name: Deploy Forgejo server (kube quadlet)
  hosts: forgejo_server
  become: true
  vars:
    podman_run_as_user: bblasco
    podman_run_as_group: bblasco
    podman_firewall:
      - port: 3000/tcp
        state: enabled
      - port: 2222/tcp
        state: enabled
    podman_quadlet_specs:
      - file_src: pod/pod-forgejo.yml
      - file_src: kube/forgejo.kube
        state: started
  roles:
    - fedora.linux_system_roles.podman

- name: Deploy Forgejo Actions runners (kube quadlet)
  hosts: forgejo_runner
  become: true
  vars:
    podman_run_as_user: bblasco
    podman_run_as_group: bblasco
    # Label name must match workflow runs-on (fedora-server-bootc). Image is official Podman+Buildah+Skopeo CI image.
    forgejo_runner_labels:
      - "fedora-server-bootc:docker://quay.io/containers/aio:v2026.10.05"
    # Job containers need Buildah/fuse and homelab registry config (see templates/forgejo-runner-config.yml.j2).
    forgejo_runner_container_privileged: true
    forgejo_runner_container_network: podman
    # label/seccomp: nested builds on SELinux hosts; fuse: buildah; registries.conf.d: micro.lan/nuc.lan insecure push.
    # Single line: colons in fuse:rw and mount paths must be quoted in generated config.yml (template uses tojson).
    forgejo_runner_container_options: "--security-opt label=disable --security-opt seccomp=unconfined --device /dev/fuse:rw -v /etc/containers/registries.conf.d:/etc/containers/registries.conf.d:ro"
    podman_quadlet_specs:
      - template_src: pod/pod-forgejo-runner.yml.j2
      - template_src: kube/forgejo-runner.kube.j2
        state: started
  # Forgejo Runner starts workflow *job* containers via a container API (Docker-compatible).
  # Rootless Podman exposes that API on the user podman.socket unit; without it the runner
  # fails with "cannot connect to docker daemon". See:
  # https://forgejo.org/docs/latest/admin/actions/runner-installation/#setting-up-the-container-environment
  pre_tasks:
    - name: Enable rootless podman API socket for Actions job containers
      become: true
      become_user: "{{ podman_run_as_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ podman_socket_uid | default(1000) }}"
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
        scope: user
  roles:
    - fedora.linux_system_roles.podman
