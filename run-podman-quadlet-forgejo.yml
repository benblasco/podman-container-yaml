---
- name: Deploy Forgejo server (kube quadlet)
  hosts: forgejo_server
  become: true
  vars:
    podman_run_as_user: bblasco
    podman_run_as_group: bblasco
    podman_firewall:
      - port: 3000/tcp
        state: enabled
      - port: 2222/tcp
        state: enabled
    podman_quadlet_specs:
      - file_src: pod/pod-forgejo.yml
      - file_src: kube/forgejo.kube
        state: started
  roles:
    - fedora.linux_system_roles.podman

- name: Deploy Forgejo Actions runners (kube quadlet)
  hosts: forgejo_runner
  become: true
  vars:
    podman_quadlet_specs:
      - template_src: pod/pod-forgejo-runner.yml.j2
      - template_src: kube/forgejo-runner.kube.j2
        state: started
  # Runner labels, container job options, and podman_run_as_* live in
  # host_vars/<host>/forgejo-runner.yml (see README.forgejo.md).
  pre_tasks:
    - name: Require per-host forgejo-runner.yml variables
      ansible.builtin.assert:
        that:
          - forgejo_runner_uuid is defined
          - forgejo_runner_token is defined
          - forgejo_runner_labels is defined
          - forgejo_runner_labels | length > 0
          - podman_run_as_user is defined
          - podman_run_as_group is defined
        fail_msg: >-
          Copy host_vars/opti.lan/forgejo-runner.yml.example to
          host_vars/{{ inventory_hostname }}/forgejo-runner.yml and set uuid, token,
          labels, and podman_run_as_user/group.
    - name: Enable system podman API socket for Actions job containers (rootful)
      when: podman_run_as_user == 'root'
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
    - name: Enable rootless podman API socket for Actions job containers
      when: podman_run_as_user != 'root'
      become: true
      become_user: "{{ podman_run_as_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ podman_socket_uid | default(1000) }}"
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
        scope: user
  roles:
    - fedora.linux_system_roles.podman
