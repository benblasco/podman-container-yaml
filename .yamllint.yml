---
# Aligns with ansible-lint yaml rule expectations (see ansible-lint docs).
extends: default

ignore: |
  archive/
  **/*.j2

rules:
  document-start: disable
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
